# Email Scanner Configuration File
# Configure the paths and settings for the email security scanner

# Directory paths
INBOX_DIR="/home/runner/work/SC/SC/inbox"
CLEAN_DIR="/home/runner/work/SC/SC/clean"
INFECTED_DIR="/home/runner/work/SC/SC/infected"
QUARANTINE_DIR="/home/runner/work/SC/SC/quarantine"
LOG_DIR="/home/runner/work/SC/SC/logs"

# Sandbox settings (Cuckoo Sandbox)
CUCKOO_API_URL="http://localhost:8090"
CUCKOO_API_TOKEN=""
CUCKOO_ENABLED="false"

# Fallback mode: when Cuckoo is not available, use ClamAV or simple hash checking
FALLBACK_MODE="simulate"  # Options: clamav, hash, simulate

# Known malware hashes (MD5)
# Add known malware hashes here, one per line
MALWARE_HASHES=(
    "44d88612fea8a8f36de82e1278abb02f"  # EICAR test file
)

# Logging
LOG_FILE="${LOG_DIR}/email_scanner.log"
LOG_LEVEL="INFO"  # Options: DEBUG, INFO, WARN, ERROR

# Email processing
MAX_ATTACHMENT_SIZE="10M"  # Maximum attachment size to process
ALLOWED_EXTENSIONS="*"      # Allowed file extensions (* for all)
